<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Acabado - Control y Progreso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Peso Acabado</h1>
        <p class="verse">"Todo lo puedo en Cristo que me fortalece." — Filipenses 4:13</p>
        
        <!-- Sección de Registro Diario -->
        <div class="card">
            <h3>Registrar Avance del Día</h3>
            <div class="form-group">
                <label for="peso-input">Peso actual (kg):</label>
                <input type="number" id="peso-input" step="0.1" placeholder="Ej: 93.5">
            </div>
            
            <div class="form-group">
                <label for="nota-input">Bitácora / Comentarios (Nike Run Club, Ejercicios en Casa):</label>
                <textarea id="nota-input" placeholder="Ej: Hoy corrí 3km y completé el Día 9..."></textarea>
            </div>

            <div class="form-group">
                <label for="imagen-input">Subir captura de evidencia:</label>
                <input type="file" id="imagen-input" accept="image/*">
            </div>

            <button id="guardar-btn">Guardar Registro en la Nube</button>
        </div>

        <!-- Sección de Historial -->
        <div class="card">
            <h3>Historial de Registros</h3>
            <ul id="history-list" class="history-list">
                <li class="history-item">Cargando registros desde Firebase...</li>
            </ul>
        </div>
    </div>

    <!-- Scripts de Firebase SDK (Versión modular compatible con web) -->
    <script type="module" src="script.js"></script>
</body>
</html>
