<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Acabado - Panel de Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Peso Acabado</h1>
        <p class="verse">"Todo lo puedo en Cristo que me fortalece." — Filipenses 4:13</p>
        
        <!-- Pestañas de Navegación -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-pantalla-chat">💬 Chat Coach</button>
            <button class="tab-btn" id="btn-pantalla-registro">📊 Bitácora & Historial</button>
        </div>

        <!-- PANTALLA 1: CHAT CON EL COACH -->
        <div id="pantalla-chat" class="screen active">
            <div class="card">
                <h3>Asesoría Virtual</h3>
                <div id="chat-messages">
                    <div class="msg coach">¡Hola Guty! Aquí puedes platicar conmigo, pedirme consejos de disciplina o una cita bíblica.</div>
                </div>
                <div class="form-group" style="margin-bottom: 5px;">
                    <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off">
                </div>
                <button id="enviar-chat-btn">Enviar Mensaje</button>
            </div>
        </div>

        <!-- PANTALLA 2: REGISTRO E HISTORIAL -->
        <div id="pantalla-registro" class="screen">
            <div class="card">
                <h3>Registrar Avance</h3>
                <div class="form-group">
                    <label for="peso-input">Peso actual (kg):</label>
                    <input type="number" id="peso-input" step="0.1" placeholder="Ej: 94">
                </div>
                
                <div class="form-group">
                    <label for="nota-input">Bitácora (Nike Run Club, Ejercicios):</label>
                    <textarea id="nota-input" placeholder="Ej: Hoy cumplí la meta..."></textarea>
                </div>

                <button id="guardar-btn">Guardar Registro</button>
            </div>

            <div class="card">
                <h3>Historial Guardado</h3>
                <ul id="history-list" class="history-list">
                    <li class="history-item">Cargando...</li>
                </ul>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
